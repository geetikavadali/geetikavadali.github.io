- title: When We Cease to Understand the World
  author: "Benjamín Labatut"
  cover: "/assets/img/books/when-we-cease-to-understand-the-world.webp"
  rating: 5
  status: read
  shelf: favorites
  year: "2019"
  pages: "192"
  finished: 2023-06-11
  slug: when-we-cease-to-understand-the-world
  genres: [Fiction, Science Fiction, War, Creative ability in science]
  review: |
    Ahh i am 2 chapters in, and I love love this book. It talks about the madness in genius, short chapters on some of the genius from the past as well as from our time. It doesn't stick to them but goes around, meanders over other smaller details and i love how the author does that.
    pretty small book so highly recommend :)

    after finishing -
    First of all, what a title. Secondly, what a cover. Thirdly, what a theme. Wehn i talk about authors writing books like they are conversing with you one-on-one, this is what I mean. Ebbing and flowing paces, taking time to explore some tiny interesting idea, keeping it short but oh so readable. This book talks about the cracks in genius, the insanity that it takes to have made the insane leaps in intellect as these men did (mind yes, no women has been included in this book at the capacity of being the force, they are merely sisters, wifes, or in case of Schrodinger, a the object of his pedophilic fantasies). Keeping that aside, i really enjoyed this juicy physics-party-talk book.

    Highly recommend to people with even high school background in science and stuff, makes you visualise people better ig.
  links:
    hardcover: "https://hardcover.app/books/when-we-cease-to-understand-the-world"

